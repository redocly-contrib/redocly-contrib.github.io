<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; img-src 'self'; style-src 'unsafe-inline'" />
    <meta name="referrer" content="no-referrer" />
    <title>Open in rev</title>
    <link rel="icon" type="image/png" href="./icon.png" />
    <style>
      body {
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 640px;
        margin: 64px auto;
        padding: 0 24px;
        color: #1f2328;
      }
      code {
        padding: 2px 6px;
        background: #f3f3f3;
        border-radius: 4px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1f1f1f;
          color: #cccccc;
        }
        code {
          background: #2b2b2b;
        }
        a {
          color: #4daafc;
        }
      }
    </style>
  </head>
  <body>
    <h1 id="title">Opening the pull request in rev…</h1>
    <p id="status">If nothing happens, rev is not installed yet.</p>
    <p><a id="open-link" href="#">Open in rev</a> · <a href="https://github.com/Redocly/rev/releases/latest">Install rev</a></p>
    <p>Or from a terminal: <code id="command"></code> <button id="copy" type="button">Copy</button></p>
    <script type="module" src="./open.js"></script>
  </body>
</html>
